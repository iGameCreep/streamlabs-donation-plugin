name: StreamTrigger
version: '${project.version}'
main: fr.gamecreep.streamtrigger.StreamTrigger
api-version: '1.21.4'
load: POSTWORLD
commands:
  info:
    description: "Get informations about the plugin !"
    usage: "/info"
  token:
    description: "Set the StreamLabs WebSocket token to use ! /info for more"
    usage: "/token <token>"
    permission: "streamtrigger.streamlabs"
permissions:
  streamtrigger.*:
    description: "Wildcard permission, allows to do everything"
    default: op
    children:
      basichomes.streamlabs: true
  streamtrigger.streamlabs:
    description: "Allows to set the StreamLabs WebSocket token to use"
    default: op